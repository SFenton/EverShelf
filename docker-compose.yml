services:
  evershelf:
    build:
      context: .
      args:
        VCS_REF: ${EVERSHELF_BUILD_SHA:?Set EVERSHELF_BUILD_SHA to the exact git commit}
    container_name: evershelf
    ports:
      - "8080:80"
    volumes:
      # Persist database and runtime data
      - evershelf_data:/var/www/html/data
      # Mount your local .env configuration
      - ./.env:/var/www/html/.env:ro
      # Set EVERSHELF_ONTOLOGY_SOCKET_DIR=$XDG_RUNTIME_DIR/evershelf-ontology
      # when enabling the host user service. The default remains inert.
      - ${EVERSHELF_ONTOLOGY_SOCKET_DIR:-/run/evershelf-ontology-disabled}:/run/evershelf-ontology:ro
    env_file:
      - ./.env
    restart: unless-stopped
    environment:
      - TZ=Europe/Rome
    group_add:
      - "${EVERSHELF_ONTOLOGY_SOCKET_GID:-1000}"
    healthcheck:
      test:
        - CMD
        - php
        - /var/www/html/scripts/container-health.php
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ontology-worker:
    profiles: ["ontology"]
    build:
      context: .
      args:
        VCS_REF: ${EVERSHELF_BUILD_SHA:?Set EVERSHELF_BUILD_SHA to the exact git commit}
    container_name: evershelf-ontology-worker
    user: "33:33"
    entrypoint:
      - php
      - -d
      - memory_limit=${ONTOLOGY_WORKER_MEMORY_LIMIT:-512M}
      - /var/www/html/scripts/ontology-controller.php
    command:
      - work
      - --db=/var/www/html/data/evershelf.db
      - --write
      - --allow-active-db
      - --loop
      - --minimum-priority=50
      - --allow-network
    volumes:
      - evershelf_data:/var/www/html/data
      - ./.env:/var/www/html/.env:ro
      - ${EVERSHELF_ONTOLOGY_SOCKET_DIR:-/run/evershelf-ontology-disabled}:/run/evershelf-ontology:ro
    env_file:
      - ./.env
    environment:
      - TZ=Europe/Rome
    group_add:
      - "${EVERSHELF_ONTOLOGY_SOCKET_GID:-1000}"
    depends_on:
      - evershelf
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - php
        - /var/www/html/scripts/check-worker-health.php
        - --needle=ontology-controller.php
        - --db=/var/www/html/data/evershelf.db
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ontology-activation-worker:
    profiles: ["ontology"]
    build:
      context: .
      args:
        VCS_REF: ${EVERSHELF_BUILD_SHA:?Set EVERSHELF_BUILD_SHA to the exact git commit}
    container_name: evershelf-ontology-activation-worker
    user: "33:33"
    entrypoint:
      - /usr/local/bin/evershelf-ontology-activation-worker
    command:
      - --db=/var/www/html/data/evershelf.db
      - --write
      - --allow-active-db
      - --allow-network
      - --max-cycles=1
      - --maximum-chunks=64
    volumes:
      - evershelf_data:/var/www/html/data
      - ./.env:/var/www/html/.env:ro
      - ${EVERSHELF_ONTOLOGY_SOCKET_DIR:-/run/evershelf-ontology-disabled}:/run/evershelf-ontology:ro
    env_file:
      - ./.env
    environment:
      - TZ=Europe/Rome
    group_add:
      - "${EVERSHELF_ONTOLOGY_SOCKET_GID:-1000}"
    depends_on:
      - evershelf
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - php
        - /var/www/html/scripts/check-worker-health.php
        - --needle=evershelf-ontology-activation-worker
        - --db=/var/www/html/data/evershelf.db
        - --heartbeat=/var/www/html/data/.ontology-activation-worker.heartbeat
        - --status-file=/var/www/html/data/.ontology-activation-worker.status
        - --activation-state
        - --max-age=900
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  recipe-score-worker:
    build:
      context: .
      args:
        VCS_REF: ${EVERSHELF_BUILD_SHA:?Set EVERSHELF_BUILD_SHA to the exact git commit}
    container_name: evershelf-recipe-score-worker
    user: "33:33"
    entrypoint:
      - php
      - -d
      - memory_limit=${RECIPE_SCORE_WORKER_MEMORY_LIMIT:-512M}
      - /var/www/html/scripts/incremental-score-worker.php
    command:
      - --db=/var/www/html/data/evershelf.db
      - --allow-active-db
      - --loop
      - --sleep-ms=200
      - --coordination-lock=/var/www/html/data/.recipe-score-coordination.lock
      - --heartbeat=/var/www/html/data/.recipe-score-worker.heartbeat
      - --status-file=/var/www/html/data/.recipe-score-worker.status
    volumes:
      - evershelf_data:/var/www/html/data
      - ./.env:/var/www/html/.env:ro
    env_file:
      - ./.env
    environment:
      - TZ=Europe/Rome
    depends_on:
      - evershelf
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - php
        - /var/www/html/scripts/check-worker-health.php
        - --needle=incremental-score-worker.php
        - --db=/var/www/html/data/evershelf.db
        - --heartbeat=/var/www/html/data/.recipe-score-worker.heartbeat
        - --status-file=/var/www/html/data/.recipe-score-worker.status
        - --max-age=900
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  canonical-worker:
    build:
      context: .
      args:
        VCS_REF: ${EVERSHELF_BUILD_SHA:?Set EVERSHELF_BUILD_SHA to the exact git commit}
    container_name: evershelf-canonical-worker
    user: "33:33"
    entrypoint: ["php", "/var/www/html/scripts/canonical-queue-worker.php"]
    command:
      - --db=/var/www/html/data/evershelf.db
      - --allow-active-db
      - --loop
    volumes:
      - evershelf_data:/var/www/html/data
      - ./.env:/var/www/html/.env:ro
    env_file:
      - ./.env
    environment:
      - TZ=Europe/Rome
      - CANONICAL_QUEUE_WAKE_SOCKET=/var/www/html/data/canonical-queue.sock
      - CANONICAL_QUEUE_BUSY_TIMEOUT_MS=${CANONICAL_QUEUE_BUSY_TIMEOUT_MS:-250}
      - CANONICAL_QUEUE_APPLY_RETRY_SECONDS=${CANONICAL_QUEUE_APPLY_RETRY_SECONDS:-20}
      - CANONICAL_QUEUE_RELEASE_RETRY_SECONDS=${CANONICAL_QUEUE_RELEASE_RETRY_SECONDS:-45}
    depends_on:
      - evershelf
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - php
        - /var/www/html/scripts/check-worker-health.php
        - --needle=canonical-queue-worker.php
        - --db=/var/www/html/data/evershelf.db
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cookidoo-bridge:
    profiles: ["cookidoo"]
    build:
      context: ./cookidoo-bridge
      args:
        VCS_REF: ${EVERSHELF_BUILD_SHA:?Set EVERSHELF_BUILD_SHA to the exact git commit}
    expose:
      - "8081"
    env_file:
      - ./cookidoo-bridge/.env
    volumes:
      - cookidoo_cookies:/data
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/Rome

volumes:
  evershelf_data:
    driver: local
  cookidoo_cookies:
    driver: local
