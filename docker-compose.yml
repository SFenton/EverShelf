services:
  evershelf:
    build: .
    container_name: evershelf
    ports:
      - "8080:80"
    volumes:
      # Persist database and runtime data
      - evershelf_data:/var/www/html/data
      # Mount your local .env configuration
      - ./.env:/var/www/html/.env:ro
      # Set EVERSHELF_ONTOLOGY_SOCKET_DIR=$XDG_RUNTIME_DIR/evershelf-ontology
      # when enabling the host user service. The default remains inert.
      - ${EVERSHELF_ONTOLOGY_SOCKET_DIR:-/run/evershelf-ontology-disabled}:/run/evershelf-ontology:ro
    env_file:
      - ./.env
    restart: unless-stopped
    environment:
      - TZ=Europe/Rome
    group_add:
      - "${EVERSHELF_ONTOLOGY_SOCKET_GID:-1000}"

  ontology-worker:
    profiles: ["ontology"]
    build: .
    container_name: evershelf-ontology-worker
    entrypoint: ["php", "/var/www/html/scripts/ontology-controller.php"]
    command:
      - work
      - --db=/var/www/html/data/evershelf.db
      - --write
      - --allow-active-db
      - --loop
      - --provider=copilot_socket
      - --model=gemini-3.7-flash
      - --critic-provider=copilot_socket
      - --critic-model=claude-sonnet-5
      - --minimum-priority=50
      - --allow-network
      - --copy-generation
      - --run-generation
      - --promote
      - --allow-active-generation
    volumes:
      - evershelf_data:/var/www/html/data
      - ./.env:/var/www/html/.env:ro
      - ${EVERSHELF_ONTOLOGY_SOCKET_DIR:-/run/evershelf-ontology-disabled}:/run/evershelf-ontology:ro
    env_file:
      - ./.env
    group_add:
      - "${EVERSHELF_ONTOLOGY_SOCKET_GID:-1000}"
    depends_on:
      - evershelf
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "none"

  cookidoo-bridge:
    profiles: ["cookidoo"]
    build:
      context: ./cookidoo-bridge
    expose:
      - "8081"
    env_file:
      - ./cookidoo-bridge/.env
    volumes:
      - cookidoo_cookies:/data
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/Rome

volumes:
  evershelf_data:
    driver: local
  cookidoo_cookies:
    driver: local
