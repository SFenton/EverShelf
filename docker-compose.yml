services:
  evershelf:
    build: .
    container_name: evershelf
    ports:
      - "8080:80"
    volumes:
      # Persist database and runtime data
      - evershelf_data:/var/www/html/data
      # Mount your local .env configuration
      - ./.env:/var/www/html/.env:ro
      # Set EVERSHELF_ONTOLOGY_SOCKET_DIR=$XDG_RUNTIME_DIR/evershelf-ontology
      # when enabling the host user service. The default remains inert.
      - ${EVERSHELF_ONTOLOGY_SOCKET_DIR:-/run/evershelf-ontology-disabled}:/run/evershelf-ontology:ro
    env_file:
      - ./.env
    restart: unless-stopped
    environment:
      - TZ=Europe/Rome
    group_add:
      - "${EVERSHELF_ONTOLOGY_SOCKET_GID:-1000}"

  ontology-worker:
    profiles: ["ontology"]
    build: .
    container_name: evershelf-ontology-worker
    user: "33:33"
    entrypoint: ["php", "/var/www/html/scripts/ontology-controller.php"]
    command:
      - work
      - --db=/var/www/html/data/evershelf.db
      - --write
      - --allow-active-db
      - --loop
      - --provider=copilot_socket
      - --model=gemini-3.7-flash
      - --critic-provider=copilot_socket
      - --critic-model=claude-sonnet-5
      - --minimum-priority=50
      - --allow-network
      - --copy-generation
      - --run-generation
      - --promote
      - --allow-active-generation
    volumes:
      - evershelf_data:/var/www/html/data
      - ./.env:/var/www/html/.env:ro
      - ${EVERSHELF_ONTOLOGY_SOCKET_DIR:-/run/evershelf-ontology-disabled}:/run/evershelf-ontology:ro
    env_file:
      - ./.env
    environment:
      - TZ=Europe/Rome
    group_add:
      - "${EVERSHELF_ONTOLOGY_SOCKET_GID:-1000}"
    depends_on:
      - evershelf
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "none"
    healthcheck:
      disable: true

  recipe-score-worker:
    build: .
    container_name: evershelf-recipe-score-worker
    user: "33:33"
    entrypoint:
      - php
      - -d
      - memory_limit=${RECIPE_SCORE_WORKER_MEMORY_LIMIT:-512M}
      - /var/www/html/scripts/incremental-score-worker.php
    command:
      - --db=/var/www/html/data/evershelf.db
      - --allow-active-db
      - --loop
      - --sleep-ms=200
    volumes:
      - evershelf_data:/var/www/html/data
      - ./.env:/var/www/html/.env:ro
    env_file:
      - ./.env
    environment:
      - TZ=Europe/Rome
    depends_on:
      - evershelf
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "none"
    healthcheck:
      disable: true

  canonical-worker:
    build: .
    container_name: evershelf-canonical-worker
    user: "33:33"
    entrypoint: ["php", "/var/www/html/scripts/canonical-queue-worker.php"]
    command:
      - --db=/var/www/html/data/evershelf.db
      - --allow-active-db
      - --loop
    volumes:
      - evershelf_data:/var/www/html/data
      - ./.env:/var/www/html/.env:ro
    env_file:
      - ./.env
    environment:
      - TZ=Europe/Rome
      - CANONICAL_QUEUE_WAKE_SOCKET=/var/www/html/data/canonical-queue.sock
      - CANONICAL_QUEUE_BUSY_TIMEOUT_MS=${CANONICAL_QUEUE_BUSY_TIMEOUT_MS:-250}
      - CANONICAL_QUEUE_APPLY_RETRY_SECONDS=${CANONICAL_QUEUE_APPLY_RETRY_SECONDS:-20}
      - CANONICAL_QUEUE_RELEASE_RETRY_SECONDS=${CANONICAL_QUEUE_RELEASE_RETRY_SECONDS:-45}
    depends_on:
      - evershelf
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      disable: true

  cookidoo-bridge:
    profiles: ["cookidoo"]
    build:
      context: ./cookidoo-bridge
    expose:
      - "8081"
    env_file:
      - ./cookidoo-bridge/.env
    volumes:
      - cookidoo_cookies:/data
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/Rome

volumes:
  evershelf_data:
    driver: local
  cookidoo_cookies:
    driver: local
